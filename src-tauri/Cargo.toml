[package]
name = "altdeck"
version = "1.0.0"
description = "AltDeck - Roblox Account Manager"
authors = ["JadXV"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync"] }
futures = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
